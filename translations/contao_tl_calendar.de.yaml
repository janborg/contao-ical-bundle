tl_calendar:
  ical_legend: "iCal Einstellungen"
  export_ical:
    0: "iCal Abonnement erstellen"
    1: "Ein iCal Abonnement aus dem Kalender generieren, die über <em>domain.tld/ical/calendar/ical_alias</em> abrufbar ist"
  share_ical:
    0: "zusätzlich iCal Datei für den Kalender in <em>public/share</em>"
    1: "Zusätzlich zur Route kann der Kalender auch unter <em>domain.tld/share/ical_alias.ics</em> als ics Datei abgerufen werden"
  share_ical_events:
    0: "zusätzlich iCal Dateien für einzelne Events in <em>public/share</em>"
    1: "Zusätzlich zur Route werden einzelne Events des Kalenders auch unter <em>domain.tld/share/alias.ics</em> als ics Datei abgerufen werden"
  ical_alias:
    0: "Kalender-Alias"
    1: "Geben Sie einen eindeutigen Namen (ohne Endung) für die ical-Datei an, sie wird veröffentlicht unter <em>domain.tld/share/ical_alias.ics</em>."
  ical_prefix:
    0: "Titel-Präfix"
    1: "Bitte geben Sie ein Präfix ein, das in der iCal-Abonnement-Datei vor allen Event-Titeln ausgegeben wird."
  ical_description:
    0: "iCal Beschreibung"
    1: "Bitte geben Sie eine kurze Beschreibung des iCal-Abonnements ein"
  ical_export_start:
    0: "Startdatum"
    1: "Bitte geben Sie das Startdatum ein, ab dem Contao Termine aus den ausgewählten Kalendern extrahieren soll. Wenn Sie kein Datum angeben, wird das aktuelle Datum als Startdatum verwendet."
  ical_export_end:
    0: "Enddatum"
    1: "Bitte geben Sie das Endatum ein, bis zu dem Contao Termine aus den ausgewählten Kalendern extrahieren soll. Wenn Sie kein Datum angeben, wird das Datum in einem Jahr als Enddatum verwendet."
